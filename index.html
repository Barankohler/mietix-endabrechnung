<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mietix Endabrechnung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
input,select,textarea{font-size:16px;font-family:inherit;max-width:100%;box-sizing:border-box}input[type=date],input[type=time],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:44px}select{min-width:0}

:root{--rot:#C4161C;--dunkel:#2E2E30;--rand:#E2E2E4;--grau:#6F6F72;--gruen:#1B8A4B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F2F2F4;font:16px/1.45 Inter,system-ui,sans-serif;color:#16161A;
  padding-bottom:40px}
header{background:var(--dunkel);color:#fff;position:sticky;top:0;z-index:9;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;border-bottom:3px solid var(--rot)}
header b{font-weight:800;letter-spacing:.14em;font-size:15px}
header b span{color:var(--rot)}
main{max-width:640px;margin:0 auto;padding:16px}
.karte{background:#fff;border:none;border-radius:20px;padding:17px;margin-bottom:18px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045)}
h2{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--grau);
  margin:0 0 12px;font-weight:800}
label{display:block;font-size:13px;font-weight:600;color:var(--grau);margin:10px 0 5px}
input,select{width:100%;padding:15px 16px;font:800 18px Inter,system-ui,sans-serif;
  border:1px solid var(--rand);border-radius:16px;background:#fff;color:#16161A;min-height:56px}
input:focus,select:focus{outline:2px solid var(--dunkel);outline-offset:-2px;border-color:var(--rand)}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.erg{background:#FAFAFB;border:1px solid var(--rand);border-radius:14px;padding:13px 15px;margin-top:12px}
.z{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.z b{font-weight:700}
.z.gross{font-size:19px;font-weight:800;border-top:1.5px solid var(--rand);margin-top:6px;padding-top:10px}
.z .k{color:var(--grau)}
.rot{color:var(--rot)}.gruen{color:var(--gruen)}
.posten{border:1px solid var(--rand);border-radius:16px;padding:13px 15px;margin-bottom:10px}
.posten.an{border-color:var(--rot);background:#FFF7F7}
.kopf{display:flex;align-items:center;gap:12px;cursor:pointer}
.kopf .t{flex:1;font-weight:700;font-size:15px}
.kopf .b{font-weight:800;font-size:15px;color:var(--grau)}
.posten.an .kopf .b{color:var(--rot)}
.schalter{width:50px;height:29px;border-radius:15px;background:#D6D6DC;position:relative;flex:0 0 auto;
  transition:background .15s}
.schalter i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.posten.an .schalter{background:var(--rot)}
.posten.an .schalter i{left:24px}
.rumpf{display:none;margin-top:12px}
.posten.an .rumpf{display:block}
.erkl{font-size:13px;line-height:1.5;color:var(--grau);background:#F4F4F6;border-radius:9px;
  padding:10px 12px;margin-top:10px}
button{width:100%;padding:17px;font:800 17px Inter,system-ui,sans-serif;border:0;border-radius:16px;
  background:var(--rot);color:#fff;margin-top:10px;min-height:56px}
button.zweit{background:#fff;color:#16161A;border:1.5px solid var(--rand)}
.hinweis{font-size:12.5px;color:var(--grau);margin-top:8px;line-height:1.45}
.wa{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:12px 14px;
  white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:12px;max-height:300px;overflow:auto}
</style></head><body>
<header><b>MIETIX <span>ENDABRECHNUNG</span></b></header>
<main>
<div id="abgleich"></div>
<div id="vertragInfo" style="display:none;background:#E8F6EE;color:#1B8A4B;border-radius:12px;padding:10px 12px;font-weight:700;margin-bottom:12px"></div>

<div class="karte">
  <h2>Fahrzeug und Freikilometer</h2>
  <label>Fahrzeug</label>
  <select id="auto"></select>
  <label>Kennzeichen</label>
  <input id="kennzeichen" type="text" placeholder="z. B. WI-MX 620" autocapitalize="characters">
  <div class="hinweis">Wird je Fahrzeug gemerkt und beim nächsten Mal vorbelegt.</div>
  <label>Freikilometer insgesamt</label>
  <input id="frei" type="number" inputmode="numeric" min="0" value="150" placeholder="z. B. 600">
  <div class="hinweis">Die Kilometer, die der Kunde laut Vertrag frei hat.</div>
</div>

<div class="karte">
  <h2>Kilometerstand</h2>
  <div class="zwei">
    <div><label>Bei Übergabe</label><input id="kmVon" type="number" inputmode="numeric" placeholder="z. B. 24500"></div>
    <div><label>Bei Rückgabe</label><input id="kmBis" type="number" inputmode="numeric" placeholder="z. B. 25740"></div>
  </div>
  <div class="erg" id="kmErg"></div>
</div>

<div class="karte">
  <h2>Weitere Kosten</h2>
  <div id="posten"></div>
</div>

<div class="karte">
  <h2>Abrechnung</h2>
  <label>Kaution</label>
  <input id="kaution" type="number" inputmode="numeric">
  <div class="erg" id="summe"></div>
</div>

<div class="karte">
  <h2>An den Kunden senden</h2>
  <label>Handynummer des Kunden</label>
  <input id="nummer" type="text" inputmode="text" autocomplete="off" placeholder="Vertragsnummer oder Name">
  <label style="display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:#16161A">
    <input id="mitErkl" type="checkbox" checked style="width:22px;height:22px;flex:0 0 auto">
    Begründungen mitschicken
  </label>
  <button id="senden">Per WhatsApp senden</button>
  <button id="kopieren" class="zweit">Text kopieren</button>
  <div class="hinweis">Ohne Nummer öffnet WhatsApp die Kontaktauswahl.</div>
  <div class="wa" id="vorschau"></div>
</div>

</main>
<script>
const D={"freiKm": 150, "stufen": [50, 100, 150, 200, 300], "cars": [{"n": "Audi RS Q8", "gp": 349.0, "pakete": [109, 189, 259, 319, 439], "kmPreis": 2.49, "kaution": 1950, "frSa": 450}, {"n": "Audi RS 5 ABT", "gp": 249.0, "pakete": [99, 169, 229, 289, 399], "kmPreis": 2.29, "kaution": 1450, "frSa": 349}, {"n": "Audi RS 3 Limousine", "gp": 199.0, "pakete": [89, 149, 199, 249, 349], "kmPreis": 1.99, "kaution": 1450, "frSa": 249}, {"n": "VW Golf 8 GTI Clubsport", "gp": 149.0, "pakete": [79, 129, 179, 219, 309], "kmPreis": 1.79, "kaution": 1000, "frSa": 199}, {"n": "Audi RS 6", "gp": 349.0, "pakete": [109, 189, 259, 319, 439], "kmPreis": 2.49, "kaution": 1950, "frSa": 450}, {"n": "Mercedes GLC 63 S AMG", "gp": 269.0, "pakete": [99, 169, 229, 289, 399], "kmPreis": 2.29, "kaution": 1450, "frSa": 349}, {"n": "Mercedes C 63 S AMG", "gp": 289.0, "pakete": [99, 169, 229, 289, 399], "kmPreis": 2.29, "kaution": 1450, "frSa": 349}, {"n": "Audi R8 performance", "gp": 399.0, "pakete": [129, 229, 309, 379, 509], "kmPreis": 2.99, "kaution": 2500, "frSa": 499}, {"n": "VW Golf 8 2.0 Diesel", "gp": 99.0, "pakete": [39, 65, 85, 99, 129], "kmPreis": 0.89, "kaution": 1000, "frSa": 129}, {"n": "Mercedes-Benz S580L AMG Chauffeur-Paket", "gp": 349.0, "pakete": [109, 189, 259, 319, 439], "kmPreis": 2.49, "kaution": 1950, "frSa": 450}, {"n": "BMW M 850i", "gp": 249.0, "pakete": [99, 169, 229, 289, 399], "kmPreis": 2.29, "kaution": 1450, "frSa": 349}]}, POSTEN=[{"k": "aufbereitung", "t": "Aufbereitung Innenraum", "betrag": 199, "art": "fest", "e": "Das Fahrzeug riecht nach Rauch, Tierhaaren oder Essen. Der Innenraum muss professionell aufbereitet werden, inklusive Ozonbehandlung, Polster und Lüftung. Während dieser Zeit kann das Fahrzeug nicht vermietet werden."}, {"k": "reinigung", "t": "Reinigung aussen und innen", "betrag": 49, "art": "fest", "e": "Vereinbart ist die Rückgabe in sauberem Zustand. Das Fahrzeug wurde stark verschmutzt zurückgegeben und musste vor der nächsten Vermietung gewaschen und ausgesaugt werden."}, {"k": "kraftstoff", "t": "Kraftstoff", "betrag": 2.5, "art": "einheit", "einheit": "fehlende Liter", "pauschale": 25, "e": "Vereinbart ist die Rückgabe mit vollem Tank. Berechnet werden die fehlenden Liter zum Tagespreis plus eine Servicepauschale für die Fahrt zur Tankstelle."}, {"k": "verspaetung", "t": "Verspätete Rückgabe", "betrag": 0, "art": "einheit", "einheit": "angefangene Stunden", "e": "Berechnet wird jede angefangene Stunde nach der vereinbarten Rückgabezeit. Ab vier Stunden entspricht das einem vollen Miettag, weil der Anschlussmieter in dieser Zeit nicht bedient werden kann."}, {"k": "schlüssel", "t": "Schlüsselverlust", "betrag": 750, "art": "fest", "e": "Ein Ersatzschlüssel muss beim Hersteller bestellt und programmiert werden. Bis er da ist, steht das Fahrzeug still."}, {"k": "papiere", "t": "Fahrzeugpapiere verloren", "betrag": 150, "art": "fest", "e": "Zulassungsbescheinigung Teil I muss neu bei der Zulassungsstelle beantragt werden. Enthalten sind Gebühren und Fahrtzeit."}, {"k": "owi", "t": "Bearbeitung Bussgeld", "betrag": 25, "art": "einheit", "einheit": "Vorgänge", "e": "Für jede behördliche Anfrage zu einem Verstoss in Ihrer Mietzeit müssen wir als Halter Auskunft geben. Berechnet wird nur dieser Aufwand. Das Bussgeld selbst zahlen Sie direkt an die Behörde."}, {"k": "abholung", "t": "Abholung oder Rückführung", "betrag": 1.5, "art": "einheit", "einheit": "Kilometer", "e": "Das Fahrzeug wurde nicht am vereinbarten Ort zurückgegeben und musste von uns abgeholt werden. Berechnet werden die gefahrenen Kilometer."}, {"k": "ausserhalb", "t": "Rückgabe ausserhalb der Zeiten", "betrag": 49, "art": "fest", "e": "Die Rückgabe fand ausserhalb der vereinbarten Zeiten statt und musste persönlich betreut werden."}, {"k": "sonstiges", "t": "Sonstiges", "betrag": 0, "art": "frei", "e": "Frei eintragbare Position mit eigener Bezeichnung."}];
const $=id=>document.getElementById(id);
const EUR=new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});
/* Paket C (28.10.2026): ?vertrag=NR holt alles aus dem Mietvertrag (gleicher Speicher wie das Vertragswerkzeug).
   Mehrkilometer-Preis ist der aus dem Vertrag (steht dort unterschrieben), sonst der aus der Preisdatei. */
let VERTRAG=null,LETZTE=null;
const zahlDE=v=>{const t=String(v==null?"":v).trim();if(!t)return 0;const n=parseFloat(t.indexOf(",")>=0?t.replace(/\./g,"").replace(",","."):t.replace(/\.(?=\d{3}(\D|$))/g,""));return isNaN(n)?0:n};
const ANGEFASST=new Set();document.addEventListener("input",e=>{if(e.target&&e.target.id)ANGEFASST.add(e.target.id)},true);
function vertragLaden(){const nr=new URLSearchParams(location.search).get("vertrag");if(!nr)return;
  try{VERTRAG=(JSON.parse(localStorage.getItem("mietixVorg"+"aenge")||"[]")).find(v=>v.nr===nr)||null}catch(e){VERTRAG=null}
  if(!VERTRAG){$("vertragInfo").style.display="block";$("vertragInfo").textContent="Vertrag "+nr+" ist auf diesem Gerät noch nicht da. Einmal oben anmelden, dann kommt er.";return}
  // Was schon von Hand getippt wurde, bleibt stehen (die Seite lädt den Vertrag ein zweites Mal, sobald die Preisdatei da ist)
  const setz=(id,w)=>{if(!ANGEFASST.has(id))$(id).value=w};
  const v=VERTRAG;const w=$("auto");if(!ANGEFASST.has("auto")&&[...w.options].some(o=>o.value===v.auto))w.value=v.auto;
  setz("kennzeichen",v.kz||"");setz("frei",Math.round(zahlDE(v.freikm))||"");
  setz("kmVon",Math.round(zahlDE((v.ueb||{}).km||v.km))||"");setz("kmBis",Math.round(zahlDE((v.rueck||{}).km))||"");
  const k=zahlDE(((v.zahlung||{}).kaut||{}).betrag);if(k)setz("kaution",k);
  if(v.telefon)setz("nummer",v.telefon);
  const mk=zahlDE(v.mehrkm);if(mk){D.cars.forEach(c=>{if(c.n===v.auto)c.kmPreis=mk})}
  $("vertragInfo").style.display="block";$("vertragInfo").textContent="Aus Mietvertrag "+v.nr+": "+v.name+", "+v.auto+". Nichts zu tippen, nur Zusatzkosten antippen, falls welche anfallen.";
  if(typeof rechne==="function")rechne()}
const NUM=new Intl.NumberFormat("de-DE");
const auto=()=>D.cars.find(a=>a.n===$("auto").value)||D.cars[0];

$("auto").innerHTML=D.cars.map(a=>'<option>'+a.n+'</option>').join("");
$("posten").innerHTML=POSTEN.map(p=>
  '<div class="posten" data-k="'+p.k+'">'
  +'<div class="kopf"><div class="schalter"><i></i></div>'
  +'<div class="t">'+p.t+'</div><div class="b" id="b_'+p.k+'">0,00 &euro;</div></div>'
  +'<div class="rumpf">'
  +(p.art==="frei"?'<label>Bezeichnung</label><input id="txt_'+p.k+'" type="text" placeholder="Wofür?">':'')
  +(p.art==="einheit"
     ?'<div class="zwei"><div><label>'+p.einheit+'</label>'
      +'<input id="m_'+p.k+'" type="number" inputmode="decimal" value="0"></div>'
      +'<div><label>Preis je Einheit</label>'
      +'<input id="p_'+p.k+'" type="number" inputmode="decimal" step="0.01" value="'+p.betrag+'"></div></div>'
      +(p.pauschale?'<label>Servicepauschale</label>'
        +'<input id="s_'+p.k+'" type="number" inputmode="decimal" value="'+p.pauschale+'">':'')
     :'<label>Betrag</label><input id="p_'+p.k+'" type="number" inputmode="decimal" step="0.01" value="'+p.betrag+'">')
  +'<div class="erkl">'+p.e+'</div>'
  +'</div></div>').join("");

document.querySelectorAll(".posten .kopf").forEach(k=>{
  k.onclick=e=>{ if(e.target.tagName==="INPUT")return;
    k.parentElement.classList.toggle("an"); rechne(); };
});

function postenListe(){
  const raus=[];
  POSTEN.forEach(p=>{
    const el=document.querySelector('.posten[data-k="'+p.k+'"]');
    if(!el.classList.contains("an"))return;
    const preis=+($("p_"+p.k)||{}).value||0;
    let betrag=preis, zusatz="";
    if(p.art==="einheit"){
      const menge=+($("m_"+p.k)||{}).value||0;
      const pausch=p.pauschale?(+($("s_"+p.k)||{}).value||0):0;
      betrag=menge*preis+pausch;
      zusatz=NUM.format(menge)+" "+p.einheit+" x "+EUR.format(preis)
             +(pausch?" + "+EUR.format(pausch)+" Pauschale":"");
    }
    let titel=p.t;
    if(p.art==="frei"){ const t=($("txt_"+p.k)||{}).value; if(t&&t.trim())titel=t.trim(); }
    $("b_"+p.k).textContent=EUR.format(betrag);
    raus.push({t:titel,betrag:betrag,zusatz:zusatz,e:p.e});
  });
  POSTEN.forEach(p=>{
    const el=document.querySelector('.posten[data-k="'+p.k+'"]');
    if(!el.classList.contains("an"))$("b_"+p.k).textContent=EUR.format(0);
  });
  return raus;
}

function rechne(){
  const a=auto();
  const frei=Math.max(0,+$("frei").value||0);
  const v=+$("kmVon").value, b=+$("kmBis").value;
  const gefahren=(v>0&&b>0&&b>=v)?b-v:0;
  const mehr=Math.max(0,gefahren-frei);
  const kmBetrag=mehr*a.kmPreis;

  $("kmErg").innerHTML=
    '<div class="z"><span class="k">Gefahren</span><b>'+NUM.format(gefahren)+' km</b></div>'
    +'<div class="z"><span class="k">Frei laut Vertrag</span><b>'+NUM.format(frei)+' km</b></div>'
    +'<div class="z"><span class="k">Mehrkilometer</span><b class="'+(mehr?'rot':'gruen')+'">'+NUM.format(mehr)+' km</b></div>'
    +(mehr?'<div class="z"><span class="k">'+NUM.format(mehr)+' km x '+EUR.format(a.kmPreis)+'</span><b class="rot">'+EUR.format(kmBetrag)+'</b></div>':'')
    +'<div class="z gross"><span>Mehrkilometer</span><span class="'+(mehr?'rot':'gruen')+'">'+EUR.format(kmBetrag)+'</span></div>';

  const liste=postenListe();
  const summe=kmBetrag+liste.reduce((s,p)=>s+p.betrag,0);
  const kaution=+$("kaution").value||0;
  const rest=kaution-summe;
  LETZTE={gefahren,mehr,kmBetrag,posten:liste.map(p=>({t:p.t,betrag:p.betrag})),summe,kaution,rest};

  $("summe").innerHTML=
    (kmBetrag?'<div class="z"><span class="k">Mehrkilometer</span><b>'+EUR.format(kmBetrag)+'</b></div>':'')
    +liste.map(p=>'<div class="z"><span class="k">'+p.t+'</span><b>'+EUR.format(p.betrag)+'</b></div>').join("")
    +(summe===0?'<div class="z"><span class="k">Keine Zusatzkosten</span><b>'+EUR.format(0)+'</b></div>':'')
    +'<div class="z gross"><span>Kosten gesamt</span><span class="'+(summe?'rot':'gruen')+'">'+EUR.format(summe)+'</span></div>'
    +'<div class="z"><span class="k">Kaution</span><b>'+EUR.format(kaution)+'</b></div>'
    +'<div class="z gross"><span>'+(rest>=0?'Rückzahlung':'Nachzahlung')+'</span><span class="'
      +(rest>=0?'gruen':'rot')+'">'+EUR.format(Math.abs(rest))+'</span></div>';

  $("vorschau").textContent=text(a,frei,gefahren,mehr,kmBetrag,liste,summe,kaution,rest);
}

function text(a,frei,gefahren,mehr,kmBetrag,liste,summe,kaution,rest){
  const erkl=$("mitErkl").checked;
  const heute=new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
  const kz=(document.getElementById("kennzeichen").value||"").trim();
  let t="Hallo,\n\nvielen Dank für die Rückgabe. Hier Ihre Abrechnung.\n\n";
  t+="*Endabrechnung "+a.n+(kz?" ("+kz+")":"")+"*\nRückgabe am "+heute+"\n";
  t+="\n*Kilometer*\n\n";
  t+="- Gefahren: "+NUM.format(gefahren)+" km\n";
  t+="- Inklusive: "+NUM.format(frei)+" km\n";
  if(mehr>0){
    t+="- Mehrkilometer: "+NUM.format(mehr)+" km x "+EUR.format(a.kmPreis)+"\n";
    t+="- Betrag: "+EUR.format(kmBetrag)+"\n";
  } else { t+="- Mehrkilometer: keine\n"; }
  if(liste.length){
    t+="\n*Weitere Positionen*\n\n";
    liste.forEach(p=>{
      t+="- "+p.t+": "+EUR.format(p.betrag)+"\n";
      if(p.zusatz)t+="  "+p.zusatz+"\n";
      if(erkl)t+="  "+p.e+"\n";
    });
  }
  t+="\n*Abrechnung*\n\n";
  t+="- Gesamt: "+EUR.format(summe)+"\n";
  t+="- Kaution: "+EUR.format(kaution)+"\n";
  t+="- "+(rest>=0?"Rückzahlung an Sie: ":"Offen von Ihnen: ")+EUR.format(Math.abs(rest))+"\n";
  t+="\nVielen Dank für die Miete. Bei Fragen melden Sie sich gerne.";
  return t;
}

function nummer(){
  let n=($("nummer").value||"").replace(/[^0-9+]/g,"");
  if(!n)return "";
  if(n.startsWith("+"))n=n.slice(1);
  else if(n.startsWith("00"))n=n.slice(2);
  else if(n.startsWith("0"))n="49"+n.slice(1);
  return n;
}
function ergebnisMerken(){if(!VERTRAG||!LETZTE)return;   // Ergebnis an den Vorgang, die Brücke trägt es in die Excel
  try{const k="mietixVorg"+"aenge",l=JSON.parse(localStorage.getItem(k)||"[]"),v=l.find(x=>x.nr===VERTRAG.nr);
    const h=new Date(),heute=h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0")+"-"+String(h.getDate()).padStart(2,"0");
    if(v){v.endabrechnung=Object.assign({},LETZTE,{am:heute});localStorage.setItem(k,JSON.stringify(l))}}catch(e){}}
$("senden").onclick=()=>{
  const n=nummer();ergebnisMerken();
  window.open("https://wa.me/"+n+"?text="+encodeURIComponent($("vorschau").textContent),"_blank");
};
$("kopieren").onclick=async()=>{
  ergebnisMerken();   // auch beim Kopieren am Vertrag merken, damit die Zusatzkosten in die Excel kommen
  try{ await navigator.clipboard.writeText($("vorschau").textContent);
    $("kopieren").textContent="Kopiert"; setTimeout(()=>$("kopieren").textContent="Text kopieren",1400);
  }catch(e){ alert("Bitte den Text unten markieren und kopieren."); }
};

$("auto").onchange=()=>{ const a=auto(); $("kaution").value=a.kaution; rechne(); };
document.addEventListener("input",rechne);
document.addEventListener("change",rechne);
$("kaution").value=D.cars[0].kaution;
rechne();

function __uebernehmen(p){
  D.freiKm=p.freiKm; D.stufen=p.kmStufen;
  D.cars=p.cars.map(function(c){return {n:c.anzeige,gp:c.gp,pakete:c.km.slice(1),
    kmPreis:c.kmPreis,kaution:c.kaution};});

        if(z.daten&&z.daten._weg){h.hash[p]="weg";delete h.felder[p]}
        else{h.hash[p]=fp(z.daten);if(FELDWEISE[k])h.felder[p]=felderVon(z.daten)}});
      if(anders){merk(k,ausMap(k,m2));geholt.push(k)}
      // 2) hoch: alles, was hier anders ist als der gemeinsame Stand (auch Gelöschtes)
      const m=alsMap(k,lies(k,c.liste?[]:{})),jetzt=new Date().toISOString(),hoch=[];
      Object.keys(m).forEach(p=>{if(gleichBasis(m[p],h.hash[p])){h.hash[p]=fp(m[p]);return}hoch.push({[c.pk]:p,daten:m[p],geaendert:jetzt})});
      Object.keys(h.hash).forEach(p=>{if(!(p in m)&&h.hash[p]!=="weg")hoch.push({[c.pk]:p,daten:{_weg:true},geaendert:jetzt})});
      for(let i=0;i<hoch.length;i+=200)await api(c.tab+"?on_conflict="+c.pk,{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(hoch.slice(i,i+200))});
      hoch.forEach(z=>{const p=z[c.pk];if(z.daten._weg){h.hash[p]="weg";delete h.felder[p]}else{h.hash[p]=fp(z.daten);if(FELDWEISE[k])h.felder[p]=felderVon(z.daten)}});
      if(k==="mietixVorgaenge"){const max=Math.max(0,...Object.keys(m).filter(n=>/^\d{6}$/.test(n)).map(Number));
        if(max)await api("rpc/vertragsnummer_mindestens",{method:"POST",body:JSON.stringify({n:max})})}
      merk("mietixAbgleich",H)}
    zuletzt=new Date();
    if(geholt.length)window.dispatchEvent(new CustomEvent("mietix-abgleich",{detail:geholt}));
  }catch(e){fehler=e.message||"Abgleich fehlgeschlagen"}
  laeuft=false;zeigen();if(nochmal){nochmal=false;setTimeout(abgleichen,500)}}
// Jede Änderung an den vier Speichern löst kurz danach einen Abgleich aus
let warte=null;
Storage.prototype.setItem=function(k,v){const alt=(this===localStorage&&SPEICHER[k])?localStorage.getItem(k):null;roh.call(this,k,v);
  if(this===localStorage&&SPEICHER[k]){clearTimeout(warte);warte=setTimeout(abgleichen,800);if(k!=="mietixStand"&&k!=="mietixPapierkorb")sicherheitsnetz(k,alt,v)}};

/* ---------- Sicherheitsnetz (28.10.2026, Baran: "Verklicken darf nichts verlieren") ----------
   1. Rückgängig: jede Änderung an einer Ablage zeigt 8 Sekunden lang einen Knopf, der den Stand davor zurückholt.
   2. Papierkorb: was aus einer Liste verschwindet, landet in mietixPapierkorb (Tabelle papierkorb, 90 Tage) und
      kann in der Zentrale wiederhergestellt werden (window.mietixWiederherstellen).
   3. Die Datenbank schreibt dazu jede Änderung in die Tabelle verlauf (SQL in tools/vertrag/speicher.sql). */
const NAMEN={mietixVorgaenge:"Vertrag",mietixAnfragen:"Anfrage",mietixKunden:"Kunde",mietixFahrzeuge:"Fahrzeug",mietixAusgaben:"Ausgabe",
  mietixSperren:"Sperre",mietixAufgaben:"Aufgabe",mietixZustand:"Zustand",mietixAutos:"Auto"};
const BESCHRIFTUNG={mietixVorgaenge:x=>"Vertrag "+(x.nr||"")+" "+(x.name||""),mietixAnfragen:x=>"Anfrage "+(x.name||"")+(x.auto?", "+x.auto:""),
  mietixAusgaben:x=>"Ausgabe "+(x.betrag!=null?String(x.betrag).replace(".",",")+" €":"")+(x.art?", "+String(x.art).trim():"")+(x.auto?", "+x.auto:""),
  mietixSperren:x=>"Sperre "+(x.auto||"")+(x.von?" ab "+x.von.split("-").reverse().join("."):""),mietixAufgaben:x=>"Aufgabe "+(x.aufgabe||""),
  mietixZustand:x=>"Zustand "+(x.auto||"")+": "+(x.text||"")};
let burst=null,burstZeit=null;
function sicherheitsnetz(k,alt,neu){
  // Papierkorb: Einträge, die aus einer Liste verschwunden sind (nicht bei Rückgängig selbst)
  if(!rueckLaeuft){try{const c=SPEICHER[k];const ma=alsMap(k,JSON.parse(alt||"null")||(c.liste?[]:{})),mn=alsMap(k,JSON.parse(neu||"null")||(c.liste?[]:{}));
    const weg=Object.keys(ma).filter(p=>!(p in mn));
    if(weg.length){const pk=lies("mietixPapierkorb",[]),jetzt=new Date().toISOString();
      weg.forEach(p=>pk.push({id:k+":"+p+":"+Date.now(),ablage:k,schluessel:p,eintrag:ma[p],zeit:jetzt,text:(BESCHRIFTUNG[k]||(x=>NAMEN[k]+" "+p))(ma[p]||{})}));
      const grenze=new Date(Date.now()-90*864e5).toISOString();merk("mietixPapierkorb",pk.filter(x=>x.zeit>grenze));
      if(sitzung){clearTimeout(warte);warte=setTimeout(abgleichen,800)}}}catch(e){}}
  if(rueckLaeuft)return;
  // Rückgängig: Änderungen innerhalb von 0,7 Sekunden gehören zusammen (z. B. Vertrag + Kunde + Fahrzeug)
  const jetzt=Date.now();if(!burst||jetzt-burstZeit>700)burst={};burstZeit=jetzt;if(!(k in burst))burst[k]=alt;
  rueckZeigen(Object.keys(burst).map(x=>NAMEN[x]||x).filter((x,i,a)=>a.indexOf(x)===i).join(", "))}
let rueckLaeuft=false,rueckTimer=null;
function rueckZeigen(text){let el=document.getElementById("mietixRueck");
  if(!el){el=document.createElement("div");el.id="mietixRueck";el.innerHTML='<span></span><button type="button">Rückgängig</button>';document.body.appendChild(el);
    el.querySelector("button").onclick=rueckgaengig}
  el.querySelector("span").textContent="Gespeichert: "+text;el.classList.add("an");clearTimeout(rueckTimer);rueckTimer=setTimeout(()=>el.classList.remove("an"),8000)}
function rueckgaengig(){if(!burst)return;
  if("mietixVorgaenge" in burst&&!confirm("Die letzte Änderung am Vertrag wird zurückgenommen (zum Beispiel das Speichern). Was im Formular steht, bleibt stehen. Weiter?"))return;
  const b=burst;burst=null;rueckLaeuft=true;
  try{Object.keys(b).forEach(k=>{if(b[k]===null)localStorage.removeItem(k);else roh.call(localStorage,k,b[k])})}finally{rueckLaeuft=false}
  const el=document.getElementById("mietixRueck");if(el){el.querySelector("span").textContent="Zurückgeholt.";clearTimeout(rueckTimer);rueckTimer=setTimeout(()=>el.classList.remove("an"),1500)}
  window.dispatchEvent(new CustomEvent("mietix-abgleich",{detail:Object.keys(b)}));clearTimeout(warte);warte=setTimeout(abgleichen,800)}
window.mietixWiederherstellen=function(id){const pk=lies("mietixPapierkorb",[]),e=pk.find(x=>x.id===id);if(!e)return false;
  const c=SPEICHER[e.ablage];if(!c)return false;const m=alsMap(e.ablage,lies(e.ablage,c.liste?[]:{}));m[e.schluessel]=e.eintrag;
  merk("mietixPapierkorb",pk.filter(x=>x.id!==id));localStorage.setItem(e.ablage,JSON.stringify(ausMap(e.ablage,m)));
  window.dispatchEvent(new CustomEvent("mietix-abgleich",{detail:[e.ablage,"mietixPapierkorb"]}));return true};
window.mietixPapierkorb=()=>lies("mietixPapierkorb",[]).slice().sort((a,b)=>a.zeit<b.zeit?1:-1);

/* ---------- Vertragsnummer aus dem gemeinsamen Speicher ---------- */
window.mietixNeueNummer=async function(){if(!sitzung||!navigator.onLine)return null;
  try{const n=await api("rpc/neue_vertragsnummer",{method:"POST",body:"{}"});return typeof n==="string"?n:null}catch(e){return null}};
window.mietixAbgleichen=abgleichen;

/* ---------- Link aus der Einladungs- oder Passwort-Mail: Passwort selbst festlegen ---------- */
let pwSetzen=false,linkFehler="";
(function(){const h=new URLSearchParams(location.hash.slice(1));if(!h.get("access_token")&&!h.get("error"))return;
  history.replaceState(null,"",location.pathname+location.search);
  if(h.get("error")){linkFehler="Der Link aus der Mail ist abgelaufen oder schon benutzt. Bitte eine neue Einladung anfordern.";return}
  sichern({access_token:h.get("access_token"),refresh_token:h.get("refresh_token"),expires_in:+h.get("expires_in")||3600});
  pwSetzen=/invite|recovery|signup/.test(h.get("type")||"")})();

/* ---------- Anzeige: Anmeldung oder Stand ---------- */
function zeigen(){const el=document.getElementById("abgleich");if(!el)return;
  if(sitzung&&pwSetzen){el.innerHTML='<div class="abgl"><b>Passwort festlegen</b><div class="abgl-text">Für '+(sitzung.email||"dieses Konto")+'. Damit meldest du dich auf allen Geräten an, auch für die Brücke. Mindestens 8 Zeichen.</div>'+
    '<input id="ablNeu" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Neues Passwort (sichtbar, damit kein Tippfehler)">'+
    '<button id="ablSetzen" type="button">Passwort speichern</button><div class="abgl-fehler" id="ablFehler"></div></div>';
    document.getElementById("ablSetzen").onclick=async()=>{const pw=document.getElementById("ablNeu").value,f=document.getElementById("ablFehler");
      if(pw.length<8){f.textContent="Bitte mindestens 8 Zeichen.";return}
      try{const t=await token();const r=await fetch(URL_+"/auth/v1/user",{method:"PUT",headers:{apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
        if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.message||"Speichern ging nicht")}
        pwSetzen=false;zeigen();abgleichen()}catch(e){f.textContent=e.message}};return}
  const pkt=document.getElementById("abgleichPunkt");
  if(pkt)pkt.style.background=!sitzung?"#B0B0B3":fehler?"#C4161C":"#1B8A4B";
  if(!sitzung){el.innerHTML='<div class="abgl rot"><b>Nicht angemeldet</b><div class="abgl-text">Einmal anmelden, dann ist alles gesichert.</div>'+
    '<input id="ablMail" type="email" inputmode="email" autocomplete="username" placeholder="E-Mail">'+
    '<input id="ablPw" type="password" autocomplete="current-password" placeholder="Passwort">'+
    '<button id="ablLos" type="button">Anmelden</button><div class="abgl-fehler" id="ablFehler">'+linkFehler+'</div>'+
    '<a href="#" id="ablNeuZugang" class="abgl-link">Noch keinen Zugang? Hier anlegen</a></div>';
    const mail=()=>document.getElementById("ablMail").value.trim(),pw=()=>document.getElementById("ablPw").value,f=document.getElementById("ablFehler");
    document.getElementById("ablLos").onclick=async()=>{f.textContent="";
      try{sichern(await auth("token?grant_type=password",{email:mail(),password:pw()}));
        zeigen();abgleichen()}catch(e){f.textContent=/Invalid login/i.test(e.message)?"E-Mail oder Passwort stimmt nicht.":e.message}};
    // Zugang selbst anlegen: geht nur, solange Baran die Registrierung in Supabase kurz freigibt
    document.getElementById("ablNeuZugang").onclick=async e=>{e.preventDefault();f.textContent="";
      if(!mail()||pw().length<8){f.textContent="Oben E-Mail und ein eigenes Passwort (mindestens 8 Zeichen) eintragen, dann hier tippen.";return}
      try{const j=await auth("signup",{email:mail(),password:pw()});
        if(j.access_token){sichern(j);zeigen();abgleichen()}else f.textContent="Zugang angelegt. Bitte die Mail bestätigen und dann anmelden."}
      catch(e){f.textContent=/not allowed|disabled/i.test(e.message)?"Zugang anlegen ist gerade gesperrt. Baran muss es kurz freigeben.":
        /already/i.test(e.message)?"Für diese E-Mail gibt es schon einen Zugang. Bitte oben anmelden.":e.message}};return}
  const stand=laeuft?"gleicht ab …":fehler?"nicht abgeglichen: "+fehler:zuletzt?"abgeglichen um "+String(zuletzt.getHours()).padStart(2,"0")+":"+String(zuletzt.getMinutes()).padStart(2,"0"):"wartet auf Internet";
  el.innerHTML='<div class="abgl klein"><span>Alle Geräte: '+stand+'</span><span><a href="#" id="ablPwNeu">Passwort ändern</a> &nbsp; <a href="#" id="ablAus">abmelden</a></span></div>';
  // Angemeldet: neues Passwort setzen geht ohne das alte (für "Passwort vergessen" ohne Mail, 28.10.2026)
  document.getElementById("ablPwNeu").onclick=e=>{e.preventDefault();pwSetzen=true;zeigen()};
  document.getElementById("ablAus").onclick=e=>{e.preventDefault();if(!confirm("Auf diesem Gerät abmelden? Die Daten bleiben hier."))return;
    sitzung=null;localStorage.removeItem("mietixSitzung");zeigen()}}
const css=document.createElement("style");
css.textContent=".abgl{background:#fff;border:1px solid #E4E4E7;border-radius:16px;padding:14px;margin-bottom:14px}"+
  ".abgl b{display:block;font-size:15px;margin-bottom:4px}.abgl-text{font-size:13px;color:#6F6F72;margin-bottom:8px}"+
  ".abgl input{width:100%;border:1px solid #E4E4E7;border-radius:12px;padding:12px;font-weight:600;font-size:16px;font-family:inherit;margin-top:6px;min-height:46px;box-sizing:border-box}"+
  ".abgl button{width:100%;margin-top:8px;background:#C4161C;color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer}"+
  ".abgl-fehler{color:#C4161C;font-size:13px;font-weight:700;margin-top:6px}"+
  ".abgl-link{display:block;text-align:center;margin-top:10px;font-size:13px;color:#6F6F72}"+
  ".abgl.klein{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#6F6F72;padding:10px 14px}.abgl.klein a{color:#6F6F72}"+
  ".abgl.rot{border:2px solid #C4161C}.abgl.rot b{color:#C4161C}"+
  "#mietixRueck{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));transform:translateY(-160%);z-index:9999;background:#2E2E30;color:#fff;"+
  "border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 14px Inter,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);"+
  "transition:transform .25s;max-width:560px;margin:0 auto;white-space:nowrap}#mietixRueck span{overflow:hidden;text-overflow:ellipsis;min-width:0}"+
  "#mietixRueck.an{transform:translateY(0)}#mietixRueck span{flex:1 1 auto}"+
  "#mietixRueck button{flex:0 0 auto!important;width:auto!important;min-height:0!important;height:auto!important;margin:0!important;box-shadow:none!important;background:#C4161C!important;color:#fff!important;border:0!important;border-radius:999px!important;padding:9px 14px!important;font:800 14px Inter,system-ui,sans-serif!important;cursor:pointer;display:inline-block!important}";
document.head.appendChild(css);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)abgleichen()});
window.addEventListener("online",abgleichen);
setInterval(abgleichen,60000);
zeigen();abgleichen();
})();
</script></body></html>
